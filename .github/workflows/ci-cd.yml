name: CI/CD - tcc-site-v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tcc-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.PREVISION_API_URL }}

      - name: Verificar tipos
        run: npm run lint

  deploy:
    name: Deploy para EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Atualizar, compilar e reiniciar na EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          VITE_APP_URL: ${{ secrets.PREVISION_API_URL }}
        with:
          host: ${{ secrets.EC2_SITE_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: VITE_APP_URL
          script: |
            set -euo pipefail
            if [ -z "${VITE_APP_URL:-}" ]; then
              echo "PREVISION_API_URL nao configurada."
              exit 1
            fi

            cd /opt/tcc-site-v2
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            npm ci
            npm run build

            sudo systemctl restart tcc-site
            sudo systemctl is-active --quiet tcc-site
            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null http://127.0.0.1:4200/; then
                exit 0
              fi
              sleep 2
            done
            echo "Site nao respondeu apos o reinicio."
            exit 1
